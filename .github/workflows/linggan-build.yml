name: LingGan Reader APK

on:
  push:
    branches:
      - copilot/linggan-reader
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linggan-reader-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build installable debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleAppDebug --build-cache --stacktrace

      - name: Collect APK
        run: |
          mkdir -p apk
          apk_path=$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          test -n "$apk_path"
          cp "$apk_path" apk/LingGanReader-debug.apk

      - name: Verify APK
        run: |
          test -s apk/LingGanReader-debug.apk
          ls -lh apk/LingGanReader-debug.apk
          sha256sum apk/LingGanReader-debug.apk > apk/LingGanReader-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LingGanReader-debug
          path: |
            apk/LingGanReader-debug.apk
            apk/LingGanReader-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
